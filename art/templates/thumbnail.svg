<?xml version="1.0" encoding="UTF-8"?>
<!--
  red-socket house style v1 / thumbnail (Nexus "primary image"), exported at 1920x1080 (16:9); drawn on a 1280x720 grid.
  Title left on charcoal, key screenshot fading in from the right.
  render.py fills: #screenshot (image), data-field="title1" / "title2" (the name split at its last space), "kicker".
  PT-BR changes to the kit template: two-line title, kicker field, worn Brazilian flag on the right.
  Safe area: 64 grid px on every side. Must stay readable at 336x189 (the Nexus tile).
-->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="1920" height="1080" viewBox="0 0 1280 720">
  <defs>
    <pattern id="concrete" patternUnits="userSpaceOnUse" width="512" height="512">
      <image href="../textures/concrete.png" width="512" height="512"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1f1f1f"/>
      <stop offset=".45" stop-color="#1f1f1f" stop-opacity=".9"/>
      <stop offset=".95" stop-color="#1f1f1f" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset=".6" stop-color="#0e0e0e" stop-opacity="0"/>
      <stop offset="1" stop-color="#0e0e0e" stop-opacity=".8"/>
    </linearGradient>
    <filter id="lift" x="-10%" y="-30%" width="120%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#0e0e0e" flood-opacity=".9"/>
    </filter>
  </defs>
  <rect id="background" width="1280" height="720" fill="#1f1f1f"/>
  <image id="screenshot" href="../shots/janitor-sign.webp"
         x="384" y="0" width="896" height="720" preserveAspectRatio="xMidYMid slice"/>
  <rect width="1280" height="720" fill="url(#fade)"/>
  <rect width="1280" height="720" fill="url(#floor)"/>
  <rect width="1280" height="720" fill="url(#concrete)" opacity=".07"/>
  <!-- worn Brazilian flag, the main visual at tile size (colours outside the palette by design) -->
  <image href="../textures/flag-br-worn.png" x="660" y="146" width="580" height="406" opacity=".92"/>
  <image href="../textures/dust.png" width="1280" height="720" preserveAspectRatio="xMidYMid slice" opacity=".08"/>

  <!-- amber rule + title block -->
  <rect x="64" y="196" width="12" height="308" fill="#ffab00"/>
  <text data-field="title1" x="104" y="300" data-fit-width="1000" data-max-size="128" data-min-size="72"
        font-family="Erika Ormig" font-size="128" fill="#cacaca" filter="url(#lift)">Obenseuer</text>
  <text data-field="title2" x="104" y="424" data-fit-width="1000" data-max-size="128" data-min-size="72"
        font-family="Erika Ormig" font-size="128" fill="#cacaca" filter="url(#lift)">PT-BR</text>
  <text data-field="kicker" x="108" y="494" data-fit-width="1000" data-max-size="40" data-min-size="28"
        font-family="&apos;Perfect DOS VGA 437&apos;" font-size="40" fill="#ffab00">MOD PARA OBENSEUER</text>

  <!-- wordmark, bottom-left inside the safe area: official logo 64 px in the 1920 export (4x) = 42.667 grid units,
       placed on whole export pixels (156, 916) so the pixel art stays crisp -->
  <g id="wordmark">
    <image href="../brand/red-socket-logo.svg" x="104" y="610.667" width="42.667" height="42.667"/>
    <text x="160.667" y="644" font-family="Erika Ormig" font-size="40" fill="#bcbab1">red-socket</text>
  </g>
</svg>
